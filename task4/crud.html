<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CRUD Posts</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <h2 class="mb-3 text-center">Post Manager</h2>

      <form id="postForm" class="card p-3 shadow-sm mb-4">
        <input type="hidden" id="editId" />

        <div class="mb-3">
          <label class="form-label">Title</label>
          <input
            type="text"
            id="title"
            class="form-control"
            placeholder="Enter title"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Body</label>
          <textarea
            id="body"
            class="form-control"
            placeholder="Enter body"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          Add Post
        </button>
      </form>

      <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>Title</th>
            <th>Body</th>
            <th style="width: 150px">Actions</th>
          </tr>
        </thead>

        <tbody id="postList"></tbody>
      </table>
    </div>

    <script>
      let posts = [];

      async function loadPosts() {
        const res = await fetch(
          "https://jsonplaceholder.typicode.com/posts?_limit=10"
        );
        posts = await res.json();
        renderPosts();
      }

      function renderPosts() {
        const tbody = document.getElementById("postList");
        tbody.innerHTML = "";

        posts.forEach((post) => {
          tbody.innerHTML += `
      <tr>
        <td>${post.title}</td>
        <td>${post.body}</td>
        <td>
          <button class="btn btn-sm btn-warning" onclick="editPost(${post.id})">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deletePost(${post.id})">Delete</button>
        </td>
      </tr>
    `;
        });
      }

      document
        .getElementById("postForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const title = document.getElementById("title").value;
          const body = document.getElementById("body").value;
          const editId = document.getElementById("editId").value;

          if (editId) {
            await fetch(
              `https://jsonplaceholder.typicode.com/posts/${editId}`,
              {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: editId, title, body }),
              }
            );

            const index = posts.findIndex((p) => p.id == editId);
            posts[index] = { id: editId, title, body };
          } else {
            const res = await fetch(
              "https://jsonplaceholder.typicode.com/posts",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, body }),
              }
            );

            const newPost = await res.json();
            posts.unshift(newPost);
          }

          this.reset();
          document.getElementById("editId").value = "";
          document.getElementById("submitBtn").textContent = "Add Post";
          renderPosts();
        });

      function editPost(id) {
        const post = posts.find((p) => p.id == id);
        document.getElementById("title").value = post.title;
        document.getElementById("body").value = post.body;
        document.getElementById("editId").value = id;
        document.getElementById("submitBtn").textContent = "Update Post";
      }

      async function deletePost(id) {
        await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`, {
          method: "DELETE",
        });
        posts = posts.filter((p) => p.id !== id);
        renderPosts();
      }

      loadPosts();
    </script>
  </body>
</html>
